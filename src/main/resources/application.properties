server.port=8080
spring.application.name=chat-app
spring.thymeleaf.cache=false

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.acks=all

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.chat.model
spring.kafka.listener.ack-mode=record

chat.kafka.topic=chat.messages
chat.kafka.group-id=local-${random.uuid}

logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.apache.kafka.clients=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.example.chat=DEBUG